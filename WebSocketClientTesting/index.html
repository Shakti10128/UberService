<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/sockjs/1.1.4/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
    
    <div>
        <button onclick="connect()">Connect</button>
    </div>

    <div>
        <input type="text" id="name">
        <button onclick="submit()">Submit</button>
    </div>

    <script>
        var stompClient = null;
        function connect(){
            // allow this origin also in you configuration at the backend side
            // else you will get the CORS error
            const socket = new SockJS("http://localhost:8083/ws")
            stompClient = Stomp.over(socket)
            

            stompClient.connect({},function() {
                console.log("connected");
                stompClient.subscribe("/topic/ping",(message)=>{
                    console.log("Messgae received from the server: ", message);
                })

                // stompClient.subscribe("/topic/scheduled",(message)=>{
                //     console.log("scheduled message received", message);
                // })

                stompClient.subscribe("/topic/rideRequest",(data)=>{
                    const response = confirm(`You have a new ride request from passenger: ${JSON.parse(data.body).passengerId} Do you accept it`);
                    // sendint the driver response either true(accepted the request), false(reject the request)
                    stompClient.send("/app/rideResponse",{},JSON.stringify({response}));
                    //debugging
                    console.log("response: " , response);
                })
            })
        }

        function submit(){
            const value = document.getElementById("name").value;

            stompClient.send("/app/ping",{},JSON.stringify({data:value}));
        }
        
    </script>
</body>
</html>
